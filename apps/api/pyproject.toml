[project]
name = "identity-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "passlib[bcrypt]>=1.7",
  "pyjwt>=2.8",
  "python-json-logger>=2.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "boto3>=1.34",
  "opensearch-py>=2.4",
  "reportlab>=4.0",
  "python-docx>=1.1",
  "requests>=2.31",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "apify-client>=3.0",
  "yfinance>=0.2.40",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "openpyxl>=3.1",
  "python-pptx>=0.6",
  "weasyprint>=60",
  "markdown>=3.5",
  "openai>=1.40",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "tenacity>=8.2",
  "sentence-transformers>=3.0",
  "pgvector>=0.3",
  "prometheus-client>=0.20",
  "scikit-learn>=1.4",
  "joblib>=1.3"
]
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
