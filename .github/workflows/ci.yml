name: CI
on:
  push:
    branches: [main, 8th-july-sprint]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Verify app loads
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./test.db
          RAG_PRELOAD: 'off'
        run: python -c "from app.main import app; print('API loads successfully')"
      - name: Run pytest (offline subset)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./test.db
          RAG_PRELOAD: 'off'
          RATE_LIMIT: 'off'
          FINNHUB_API_KEY: ''
          FMP_API_KEY: ''
        run: |
          pip install pytest pytest-timeout
          set -o pipefail
          # -m 'not network' keeps CI hermetic: without keys or outbound access the
          # provider-backed tests fail for environmental reasons and drown out real
          # regressions. Run the full suite separately where credentials exist.
          python -m pytest tests/ -q --timeout=60 -m 'not network' \
            --continue-on-collection-errors 2>&1 | tail -30
      - name: Verify migrations apply to an empty database
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./migration_check.db
          RAG_PRELOAD: 'off'
        run: |
          # Catches drift between models and migrations: a model added without a
          # matching revision would otherwise only surface on a production deploy.
          alembic upgrade head
          python -c "
          import sqlite3
          tables = [r[0] for r in sqlite3.connect('migration_check.db').execute(
              \"select name from sqlite_master where type='table'\")]
          assert 'alembic_version' in tables, 'migrations did not run'
          assert len(tables) > 40, f'only {len(tables)} tables created'
          print(f'{len(tables)} tables created from migrations')
          "

      - name: Check no random imports in app code
        run: |
          # Recursive on purpose: the previous non-recursive glob missed app/api/status.py.
          # app/quality/synthetic.py is an offline training-data generator, not served code.
          if grep -rn --include='*.py' "^\s*import random\|^\s*from random import" \
               apps/api/app/services apps/api/app/api apps/api/app/connectors \
               | grep -v 'quality/synthetic.py'; then
            echo "ERROR: Found import random in served app code!"
            exit 1
          fi
      - name: Verify all routers load (no silent failures)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./test.db
          RAG_PRELOAD: 'off'
        run: |
          python -c "
          from app.main import app
          spec = app.openapi()
          ops = sum(1 for p in spec['paths'] for m in spec['paths'][p] if m in ('get','post','put','delete','patch'))
          print(f'Routes: {ops} operations across {len(spec[\"paths\"])} paths')
          assert ops > 800, f'Expected 800+ ops, got {ops} — a router failed to load'
          "

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
