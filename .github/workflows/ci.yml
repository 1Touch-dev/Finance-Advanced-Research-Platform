name: CI
on:
  push:
    branches: [main, 8th-july-sprint]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Run smoke test (offline mode)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./test.db
          RAG_PRELOAD: 'off'
        run: python -c "from app.main import app; print('API loads successfully')"
      - name: Check no random imports in services
        run: |
          if grep -r "import random" apps/api/app/services/*.py; then
            echo "ERROR: Found import random in services!"
            exit 1
          fi

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
